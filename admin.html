<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex,nofollow" />
<title>Panel · Referidos Outlier</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, system-ui, sans-serif; background: #0b0b0d; color: #eee; padding: 24px; }
  h1 { font-size: 1.4rem; margin-bottom: 4px; }
  .muted { color: #888; font-size: .85rem; margin-bottom: 20px; }
  .gate { max-width: 340px; margin: 80px auto; text-align: center; }
  .gate input { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #333; background: #151517; color: #fff; margin: 10px 0; }
  .gate button, .btn { padding: 10px 16px; border-radius: 10px; border: 0; background: #6c8cff; color: #fff; font-weight: 700; cursor: pointer; }
  .metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px,1fr)); gap: 12px; margin-bottom: 22px; }
  .metric { background: #151517; border: 1px solid #262629; border-radius: 14px; padding: 16px; }
  .metric .n { font-size: 1.7rem; font-weight: 800; }
  .metric .l { font-size: .78rem; color: #8a8a8f; margin-top: 3px; text-transform: uppercase; letter-spacing: .05em; }
  .metric.risk .n { color: #ffb454; }
  .metric.secured .n { color: #6ede8a; }
  .tools { margin: 20px 0; display: flex; gap: 10px; flex-wrap: wrap; }
  textarea { width: 100%; background: #151517; color: #fff; border: 1px solid #333; border-radius: 8px; padding: 6px; font-size: .8rem; }
  code { background: #1a1a1d; padding: 1px 5px; border-radius: 5px; }

  .board { display: flex; gap: 12px; align-items: flex-start; overflow-x: auto; padding-bottom: 12px; }
  .col { flex: 1 1 0; min-width: 200px; background: #121215; border: 1px solid #232327; border-radius: 14px; padding: 10px; }
  .col-head { display: flex; justify-content: space-between; align-items: center; padding: 4px 6px 10px; }
  .col-name { font-weight: 800; font-size: .82rem; text-transform: uppercase; letter-spacing: .04em; color: #ccc; }
  .col-count { font-size: .78rem; color: #8a8a8f; }
  .col.drop-hover { background: #171a24; border-color: #6c8cff; }
  .card { background: #1a1a1e; border: 1px solid #2a2a2f; border-radius: 10px; padding: 10px; margin-bottom: 8px; cursor: grab; }
  .card:active { cursor: grabbing; }
  .card.dragging { opacity: .4; }
  .card .name { font-weight: 700; font-size: .9rem; margin-bottom: 4px; }
  .card .meta { font-size: .75rem; color: #9a9aa0; line-height: 1.5; }
  .card .meta b { color: #ddd; }
  .card .row { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; }
  .pill { font-size: .7rem; padding: 2px 8px; border-radius: 999px; background: #262629; }
  .pill.aether { background: #2a2638; color: #b9a6ff; }
  .days { font-weight: 700; font-size: .78rem; }
  .days.warn { color: #ffb454; } .days.crit { color: #ff6b6b; } .days.ok { color: #6ede8a; }
  .wa { color: #25d366; text-decoration: none; font-weight: 700; font-size: .75rem; }
  .notas { width: 100%; margin-top: 6px; display: none; }
  .card.show-notas .notas { display: block; }
  .card .nbtn { float: right; color: #666; cursor: pointer; font-size: .7rem; }
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #1d2a1d; border: 1px solid #3a5a3a; color: #9fe8a8; padding: 10px 18px; border-radius: 10px; font-size: .85rem; opacity: 0; transition: opacity .25s; pointer-events: none; }
  .toast.show { opacity: 1; }
  .waQueueBox { display: none; margin-bottom: 22px; }
</style>
</head>
<body>
<div id="gate" class="gate">
  <h1>Panel de Referidos</h1>
  <input type="password" id="secret" placeholder="Admin secret" />
  <button onclick="enter()">Entrar</button>
  <p id="gateErr" class="muted"></p>
</div>

<div id="app" style="display:none">
  <h1>Panel de Referidos Outlier</h1>
  <p class="muted">Arrastra un lead entre columnas para cambiar su etapa · dinero en juego · cola de WhatsApp</p>

  <div class="metrics" id="metrics"></div>

  <div class="tools">
    <button class="btn" onclick="load()">↻ Actualizar</button>
    <button class="btn" style="background:#333" onclick="toggleWA()">📱 Cola WhatsApp</button>
  </div>

  <div class="waQueueBox" id="waQueue"></div>

  <div class="board" id="board"></div>
</div>

<div class="toast" id="toast"></div>

<script>
var SECRET = '';
var STAGES = [];
var LEADS = [];
var DRAG_ID = null;

function enter() {
  SECRET = document.getElementById('secret').value.trim();
  load(true);
}
function toggleWA() {
  var q = document.getElementById('waQueue');
  q.style.display = q.style.display === 'none' ? 'block' : 'none';
}
function daysClass(d) { return d < 5 ? 'crit' : (d < 12 ? 'warn' : 'ok'); }

function waLink(num, nombre) {
  var msg = encodeURIComponent('Hola ' + nombre + ', soy Gael 👋 Te escribo para ver cómo vas con tu registro en Outlier y ayudarte a que arranques con tus primeras tareas. ¿Ya hiciste el assessment?');
  var clean = (num || '').replace(/[^0-9]/g, '');
  return 'https://wa.me/' + clean + '?text=' + msg;
}

function load(first) {
  fetch('/admin/data?secret=' + encodeURIComponent(SECRET))
    .then(function (r) { if (!r.ok) throw new Error('401'); return r.json(); })
    .then(function (d) {
      document.getElementById('gate').style.display = 'none';
      document.getElementById('app').style.display = 'block';
      STAGES = d.stages; LEADS = d.leads;
      renderMetrics(d.metrics); renderBoard(d.leads); renderWA(d.leads);
    })
    .catch(function () {
      if (first) document.getElementById('gateErr').textContent = 'Secret incorrecto.';
    });
}

function renderMetrics(m) {
  document.getElementById('metrics').innerHTML =
    metric(m.total, 'Total leads', '') +
    metric('$' + m.at_risk_usd, 'En riesgo', 'risk') +
    metric('$' + m.secured_usd, 'Asegurado', 'secured') +
    metric(m.conversion_pct + '%', 'Conversión', '');
}
function metric(n, l, cls) {
  return '<div class="metric ' + cls + '"><div class="n">' + n + '</div><div class="l">' + l + '</div></div>';
}

function renderBoard(leads) {
  var board = document.getElementById('board');
  board.innerHTML = '';
  STAGES.forEach(function (st) {
    var inCol = leads.filter(function (l) { return l.etapa === st; });
    var usd = inCol.reduce(function (a, l) { return a + (l.reward_usd || 0); }, 0);
    var col = document.createElement('div');
    col.className = 'col';
    col.dataset.stage = st;
    col.innerHTML =
      '<div class="col-head"><span class="col-name">' + esc(st) + '</span>' +
      '<span class="col-count">' + inCol.length + ' · $' + usd + '</span></div>';
    inCol.forEach(function (l) { col.appendChild(card(l)); });
    col.addEventListener('dragover', function (e) { e.preventDefault(); col.classList.add('drop-hover'); });
    col.addEventListener('dragleave', function () { col.classList.remove('drop-hover'); });
    col.addEventListener('drop', function (e) {
      e.preventDefault();
      col.classList.remove('drop-hover');
      if (DRAG_ID != null && st !== stageOf(DRAG_ID)) upd(DRAG_ID, st);
    });
    board.appendChild(col);
  });
}

function stageOf(id) {
  var l = LEADS.find(function (x) { return x.id === id; });
  return l ? l.etapa : null;
}

function card(l) {
  var el = document.createElement('div');
  el.className = 'card';
  el.draggable = true;
  el.dataset.id = l.id;
  var paid = l.etapa === 'pagado' || l.etapa === 'perdido';
  var dCls = paid ? 'ok' : daysClass(l.days_left);
  var wa = l.whatsapp
    ? '<a class="wa" target="_blank" href="' + waLink(l.whatsapp, l.nombre) + '">💬 wa ' + esc(l.whatsapp) + '</a>'
    : '<span style="color:#555">sin WhatsApp</span>';
  el.innerHTML =
    '<div class="name">' + esc(l.nombre) + ' <span class="nbtn" onclick="toggleNotas(this)">✎</span></div>' +
    '<div class="meta">' + esc(l.email) + '<br>' + wa + '</div>' +
    '<div class="row">' +
      '<span class="pill' + ((l.tipo || '') === 'Aether' ? ' aether' : '') + '">' + esc(l.tipo || 'Outlier') + '</span>' +
      '<span style="font-weight:700;font-size:.8rem">$' + (l.reward_usd || 0) + '</span>' +
      '<span class="days ' + dCls + '">' + (paid ? '—' : l.days_left + 'd') + '</span>' +
      '<span style="font-size:.75rem;color:#9a9aa0">' + (l.tasks_done || 0) + '/' + (l.tasks_total || 0) + '</span>' +
    '</div>' +
    '<textarea rows="1" class="notas" placeholder="Notas…" onblur="updNota(' + l.id + ', this.value)">' + esc(l.notas || '') + '</textarea>';
  el.addEventListener('dragstart', function () { DRAG_ID = l.id; el.classList.add('dragging'); });
  el.addEventListener('dragend', function () { DRAG_ID = null; el.classList.remove('dragging'); });
  return el;
}

function toggleNotas(btn) {
  btn.closest('.card').classList.toggle('show-notas');
}

function renderWA(leads) {
  var pending = leads.filter(function (l) {
    return ['registrado', 'assessment', 'estancado'].indexOf(l.etapa) >= 0;
  });
  document.getElementById('waQueue').innerHTML =
    '<h3 style="margin-bottom:10px">A quién escribirle hoy (' + pending.length + ')</h3>' +
    (pending.length ? pending.map(function (l) {
      return '<div style="padding:8px 0;border-bottom:1px solid #222">' +
        '<b>' + esc(l.nombre) + '</b> · ' + l.days_left + 'd restantes · etapa: ' + l.etapa +
        ' — <a class="wa" target="_blank" href="' + waLink(l.whatsapp, l.nombre) + '">Escribir por WhatsApp →</a></div>';
    }).join('') : '<p class="muted">Nadie pendiente. 🎉</p>');
}

function upd(id, etapa) {
  post('/admin/update', { id: id, etapa: etapa, notas: findNota(id) })
    .then(function (r) { return r.json(); })
    .then(function (d) {
      if (d.ok) { toast('Movido a «' + etapa + '» ✓'); load(); }
      else toast('Error: ' + (d.detail || '?'));
    })
    .catch(function () { toast('Error de red'); });
}
function updNota(id, notas) {
  var l = LEADS.find(function (x) { return x.id === id; });
  post('/admin/update', { id: id, etapa: l ? l.etapa : 'registrado', notas: notas });
}
function findNota(id) { var l = LEADS.find(function (x) { return x.id === id; }); return l ? (l.notas || '') : ''; }

function post(url, body) {
  return fetch(url + '?secret=' + encodeURIComponent(SECRET), {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body)
  });
}
function toast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._h);
  t._h = setTimeout(function () { t.classList.remove('show'); }, 1800);
}
function esc(s) { return (s == null ? '' : String(s)).replace(/[&<>"]/g, function (c) {
  return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
</script>
</body>
</html>
